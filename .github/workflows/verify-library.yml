name: Verify library and build test IPA

on:
  push:
    branches: [codex/my-library]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: library-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'
      - name: Select simulator
        run: |
          mkdir -p build
          xcrun simctl list devices available -j > build/devices.json
          python3 - <<'PY'
          import json, os
          devices = json.load(open('build/devices.json'))['devices']
          candidates = [(runtime, d) for runtime, ds in devices.items() if 'iOS' in runtime for d in ds if 'iPhone' in d['name'] and d['isAvailable']]
          runtime, device = sorted(candidates, key=lambda pair: pair[0], reverse=True)[0]
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('SIMULATOR_ID=' + device['udid'] + '\n')
          print(runtime, device['name'])
          PY
      - name: Run unit and library UI tests
        run: |
          set -o pipefail
          xcodebuild test -project PiliPod.xcodeproj -scheme PiliPod \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -resultBundlePath build/LibraryTests.xcresult \
            -only-testing:PiliPodTests -only-testing:PiliPodUITests/LibraryUITests \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee build/test.log
      - name: Archive unsigned iOS app
        run: |
          set -o pipefail
          xcodebuild archive -project PiliPod.xcodeproj -scheme PiliPod \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/PiliPod.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" PROVISIONING_PROFILE_SPECIFIER="" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            | tee build/archive.log
      - name: Package test IPA
        run: |
          mkdir -p build/Payload
          cp -R build/PiliPod.xcarchive/Products/Applications/PiliPod.app build/Payload/
          cd build
          zip -qry PiliPod-library-test.ipa Payload
          unzip -t PiliPod-library-test.ipa
          shasum -a 256 PiliPod-library-test.ipa > PiliPod-library-test.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: PiliPod-library-test-IPA
          path: |
            build/PiliPod-library-test.ipa
            build/PiliPod-library-test.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Library-test-results
          path: |
            build/*.log
            build/LibraryTests.xcresult
      - name: Export UI test screenshots
        if: always()
        run: |
          if [ -d build/LibraryTests.xcresult ]; then
            xcrun xcresulttool export attachments --path build/LibraryTests.xcresult --output-path build/screenshots
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Library-UI-screenshots
          path: build/screenshots
