name: Verify iOS build

on:
  push:
    branches: ['codex/video-detail-back-gesture']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'
      - name: Build for iOS Simulator
        run: >-
          xcodebuild build
          -project PiliPod.xcodeproj
          -scheme PiliPod
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
