name: Verify iOS build

on:
  push:
    branches: ['codex/video-detail-back-gesture']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'
      - name: Build for iOS Simulator
        run: >-
          xcodebuild build
          -project PiliPod.xcodeproj
          -scheme PiliPod
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO

  ipa:
    if: github.ref == 'refs/heads/codex/video-detail-back-gesture'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'
      - name: Archive unsigned iOS app
        run: >-
          xcodebuild archive
          -project PiliPod.xcodeproj
          -scheme PiliPod
          -configuration Release
          -destination 'generic/platform=iOS'
          -archivePath build/PiliPod.xcarchive
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGN_IDENTITY=""
          PROVISIONING_PROFILE_SPECIFIER=""
      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -R build/PiliPod.xcarchive/Products/Applications/PiliPod.app build/Payload/
          cd build
          zip -qr PiliPod-back-gesture.ipa Payload
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PiliPod-back-gesture-unsigned-IPA
          path: build/PiliPod-back-gesture.ipa
          retention-days: 14
          if-no-files-found: error
