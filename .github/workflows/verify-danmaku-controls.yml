name: Verify danmaku controls

on:
  push:
    branches: ['codex/video-danmaku-controls']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'
      - name: Archive unsigned iOS app
        run: >-
          xcodebuild archive
          -project PiliPod.xcodeproj
          -scheme PiliPod
          -configuration Release
          -destination 'generic/platform=iOS'
          -archivePath build/PiliPod.xcarchive
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGN_IDENTITY=""
          PROVISIONING_PROFILE_SPECIFIER=""
      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -R build/PiliPod.xcarchive/Products/Applications/PiliPod.app build/Payload/
          cd build
          zip -qr PiliPod-danmaku-controls.ipa Payload
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PiliPod-danmaku-controls-unsigned-IPA
          path: build/PiliPod-danmaku-controls.ipa
          retention-days: 14
          if-no-files-found: error
