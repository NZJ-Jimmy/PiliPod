name: Verify dynamic filters

on:
  push:
    branches: [codex/dynamic-filters]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dynamic-filters-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'
      - name: Compile app and run unit tests
        run: |
          set -o pipefail
          mkdir -p build
          SIMULATOR_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime in sorted(devices, reverse=True):
              if "iOS" in runtime:
                  for device in devices[runtime]:
                      if device["name"].startswith("iPhone") and device["isAvailable"]:
                          print(device["udid"])
                          sys.exit(0)
          sys.exit("No available iPhone simulator")')
          xcodebuild test -project PiliPod.xcodeproj -scheme PiliPod \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -only-testing:PiliPodTests -parallel-testing-enabled NO \
            -resultBundlePath build/DynamicFilterTests.xcresult \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee build/test.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Dynamic-filter-test-results
          path: |
            build/test.log
            build/DynamicFilterTests.xcresult
